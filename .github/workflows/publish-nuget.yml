name: Publish NuGet package

on:
  workflow_dispatch:

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  publish:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        configuration: [
          "Release_2021.1.100", "Release_2022.1.80", "Release_2023.1.90", "Release_2024.3.60",
          "Release_2025.4.60", "Release_2026.4.10", "Release_2027.3.0"
        ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify release tag, changelog and branch
      shell: pwsh
      run: ./scripts/Verify-Release.ps1 -FromHeadTag -AncestorOf main
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          **/Directory.Packages.props
          NuGet.config
    - name: Build
      run: dotnet build --configuration "${{ matrix.configuration }}" -p:Platform=x64 -p:TreatWarningsAsErrors=true -p:EnforcePublicApiDocumentation=true /nologo
    - name: Run tests
      shell: pwsh
      run: |
        $testProjects = Get-ChildItem -Recurse -Filter *.csproj |
          Where-Object { $_.Name -match '\.Tests\.csproj$' -and $_.Name -notmatch 'RevitTests' }

        foreach ($project in $testProjects) {
          $year = [int]([regex]::Match("${{ matrix.configuration }}", '^Release_(\d{4})\.').Groups[1].Value)
          $framework = if ($year -ge 2027) { "net10.0-windows" } elseif ($year -ge 2025) { "net8.0-windows" } else { "net48" }
          $testExecutable = Join-Path $project.DirectoryName "bin/x64/${{ matrix.configuration }}/$framework/$($project.BaseName).exe"
          if (-not (Test-Path -LiteralPath $testExecutable)) {
            throw "Test executable was not produced: $testExecutable"
          }
          & $testExecutable
          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed for $($project.FullName) with exit code $LASTEXITCODE."
          }
        }
    - name: Verify NuGet package
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $packages = @(Get-ChildItem "artifacts" -Recurse -File -Filter *.nupkg)
        if ($packages.Count -ne 1) { throw "Expected exactly one NuGet package, found $($packages.Count)." }
        $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
        try {
          $entries = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
          if ($entries.Count -ne 1) { throw "Expected exactly one nuspec in $($packages[0].Name)." }
          $reader = [System.IO.StreamReader]::new($entries[0].Open())
          try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
        } finally { $archive.Dispose() }
        $id = $nuspec.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='id']").InnerText
        $version = $nuspec.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='version']").InnerText
        if ($id -ne 'VolocyNazad.Revit.Events') { throw "Unexpected package id '$id'." }
        $tag = @(git tag --points-at HEAD | Where-Object { $_ -match '^\d+\.\d+\.\d+$' })[0]
        $patch = $tag.Split('.')[2]
        $configuration = "${{ matrix.configuration }}"
        if ($configuration -notmatch '^Release_(\d{4})\.') { throw "Cannot determine the Revit year from configuration '$configuration'." }
        $expectedVersion = "$($Matches[1]).0.$patch"
        if ($version -ne $expectedVersion) { throw "Package version '$version' does not match expected release version '$expectedVersion'." }

    - name: Publish NuGet package
      run: |
        $packages = @(Get-ChildItem "artifacts" -Recurse -File -Filter *.nupkg)
        if ($packages.Count -ne 1) { throw "Expected exactly one validated NuGet package, found $($packages.Count)." }
        foreach($file in $packages) {
            dotnet nuget push $file --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
